<title>야간비행 조종석</title>

<style>


:root{
  
  
  --fs-1:22px; --fs-2:17px; --fs-3:15px; --fs-4:13px; --fs-5:12px;
  --ground:#0A0B0C; --panel:#111214; --ink:#F2F3F4; --ink-2:#C4C9D0; --muted:#878C94; --faint:#5A5F66;
  --rule:#1F2124; --rule-2:#17181B;
  --now:#F2F3F4; --now-ink:#0A0B0C; --done:#5A5F66;
  --alert:#F0A860; --alert-bg:#1C140D; --alert-rule:#3A2817;   
  --open:#C4C9D0; --open-bg:#141618; --open-rule:#2A2D31;
  --done-b:#1FA8FF;   
  --live:#D9DCE0; --live-rule:#3A3D41;    --stop:#E5534B; --rail:#2A2D31;
  color-scheme:dark;
}
*{box-sizing:border-box}
b,strong{font-weight:600}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}      
body{background:var(--ground); color:var(--ink); margin:0; line-height:1.55; font-size:var(--fs-4);
  font-family:"Geist","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:44rem; margin:0 auto; padding-inline:16px; padding-block:24px 64px}

.wrap *{min-width:0}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace; font-variant-numeric:tabular-nums}


header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
.eye{font-size:var(--fs-5); letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin:0 0 2px}
h1{font-size:var(--fs-1); font-weight:600; letter-spacing:-.01em; margin:0}
#live{display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-5);
  letter-spacing:.08em; color:var(--faint)}
#live .d{width:6px; height:6px; border-radius:50%; background:var(--faint)}
#live.on{color:var(--live)} #live.on .d{background:var(--live)}
@media (prefers-reduced-motion:no-preference){ #live.on .d{animation:pl 2.4s ease-in-out infinite} }
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}


.sec{margin-top:24px}
.sec > .cap{font-size:var(--fs-5); letter-spacing:.14em; text-transform:uppercase;
  color:var(--faint); font-weight:600; margin:0 0 2px; padding-bottom:4px;
  border-bottom:1px solid var(--rule)}
.sec > .cap em{font-style:normal; text-transform:none; letter-spacing:0; color:var(--alert)}
#stuck-sec > .cap{color:var(--alert); border-bottom-color:var(--alert-rule)}

.ft{padding:12px 0; border-top:1px solid var(--rule-2)}
.ft:first-child{border-top:0}
.ft .fn{font-weight:600; color:var(--ink)}
.ft .fc{color:var(--muted); font-size:.86em; margin-left:8px}
.ft .rail2{height:4px; border-radius:2px; background:var(--rule); margin:8px 0 4px; overflow:hidden}
.ft .rail2 > i{display:block; height:100%; background:var(--now)}
.ft .fl{color:var(--ink-2); font-size:.9em; margin:2px 0}
.ft .fl b{color:var(--muted); font-weight:600; margin-right:4px}
.ft .miss{color:var(--alert); background:var(--alert-bg); border:1px solid var(--alert-rule);
          border-radius:6px; padding:8px 8px; margin-top:4px; font-size:.9em}
.ft .warn2{color:var(--muted); font-size:.86em; margin-top:3px}


.alarm{display:grid; grid-template-columns:16px 1fr; gap:8px; padding:12px 0;
  border-bottom:1px solid var(--rule-2)}
.alarm:last-child{border-bottom:0}
.alarm .ic{color:var(--alert); margin-top:3px}
.alarm .w{margin:0; font-size:var(--fs-2); font-weight:600; line-height:1.3}
.alarm .lk{margin:3px 0 0; font-size:var(--fs-5); color:var(--muted); font-weight:400}
.alarm .td{margin:8px 0 0; font-size:var(--fs-4); line-height:1.55; color:var(--ink);
  padding-left:12px; border-left:2px solid var(--alert-rule)}
.alarm .td b{display:block; font-size:var(--fs-5); letter-spacing:.12em; text-transform:uppercase;
  color:var(--alert); font-weight:600; margin-bottom:2px}
.idle{margin:12px 0 0; font-size:var(--fs-4); color:var(--muted); font-weight:400}


.ask .q{margin:12px 0 0; font-size:var(--fs-2); font-weight:600; line-height:1.55}
.ask .why{margin:8px 0 0; font-size:var(--fs-4); color:var(--ink-2); font-weight:400}
.ask .did{margin:12px 0 0; padding:0; list-style:none}
.ask .did .h{font-size:var(--fs-5); letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin-bottom:3px}
.ask .did li{font-size:var(--fs-4); color:var(--muted); font-weight:400; padding-left:12px; position:relative}
.ask .did li::before{content:"·"; position:absolute; left:2px}


.rail{margin-top:4px}
.st{position:relative; padding-left:24px}
.st::before{content:""; position:absolute; left:7px; top:0; bottom:0; width:1px; background:var(--rail)}
.st:first-of-type::before{top:16px}
.st:last-of-type::before{height:16px; bottom:auto}
.st::after{content:""; position:absolute; left:1px; top:10px; width:13px; height:13px;
  border-radius:50%; background:var(--ground); border:1.5px solid var(--rail); box-sizing:border-box}
.st.p::after{background:var(--done); border-color:var(--done)}

.st.op::after{background:var(--ground); border-color:var(--open); border-width:2px}
.st.op .nm{color:var(--ink-2); font-weight:400}

.st.sk::after{background:var(--ground); border-color:var(--rule); border-style:dashed}
.st.sk .nm{color:var(--faint); font-weight:400}
.st.sk > summary .nm::after{opacity:.45}   
.st.c::after{border-color:var(--now); border-width:4px; background:var(--panel)}
.st > summary{display:flex; align-items:center; gap:8px; padding:8px 0; cursor:pointer; list-style:none}
.st > summary::-webkit-details-marker{display:none}
.st > summary:focus-visible{outline:2px solid var(--now); outline-offset:2px; border-radius:2px}
.st .nm{font-size:var(--fs-4); color:var(--faint); font-weight:400; flex:none}
.st.p .nm{color:var(--done)}
.st.c .nm{color:var(--ink); font-weight:600; font-size:var(--fs-4)}
.st .mt{display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; align-items:center;
  order:2; margin-left:auto}

.st > summary .nm::after{content:""; display:inline-block; width:7px; height:7px;
  border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
  transform:rotate(45deg) translate(-2px,-3px); margin-left:8px; vertical-align:middle}
.st[open] > summary .nm::after{transform:rotate(-135deg) translate(-2px,-1px)}
.st.c > summary .nm::after{border-color:var(--ink)}
.st > summary:hover .nm::after{border-color:var(--open)}
.st > summary:hover .nm{color:var(--ink)}


.chip{display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-5); line-height:1;
  padding:3px 8px; border-radius:999px; background:var(--rule-2); color:var(--muted); white-space:nowrap}
.chip.warn{background:var(--alert-bg); color:var(--alert)}
.chip.info{background:var(--open-bg); color:var(--open)}
.chip.solid{background:var(--now); color:var(--now-ink)}
.chip.ok{color:var(--live); background:transparent; padding-left:0}

.chip.skip{background:transparent; border:1px dashed var(--rail); color:var(--faint)}


.body{padding:2px 0 16px}
.grp{margin-top:12px}
.grp:first-child{margin-top:4px}
.grp > .t{font-size:var(--fs-5); letter-spacing:.12em; text-transform:uppercase;
  color:var(--faint); margin:0 0 4px}
.grp.re > .t{color:var(--alert)}
.rows{list-style:none; margin:0; padding:0}
.rows > li{display:flex; gap:8px; align-items:baseline; padding:4px 0; border-bottom:1px solid var(--rule-2)}
.rows > li:last-child{border-bottom:0}
.rows .tx{flex:1; min-width:0; font-size:var(--fs-4); line-height:1.55; color:var(--ink)}
.rows .tx > b{display:block; color:var(--ink); font-weight:600; margin-bottom:2px}
.rows .sub{display:block; font-size:var(--fs-5); color:var(--muted); font-weight:400; margin-top:2px}
.rows .sub.bad{color:var(--alert)}
.rows .rt{flex:none; display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; max-width:44%}
.rows li.dim .tx > b{color:var(--muted); font-weight:400}


.past{margin-top:12px}
.past > summary{font-size:var(--fs-5); letter-spacing:.12em; text-transform:uppercase;
  color:var(--faint); cursor:pointer; list-style:none; padding:2px 0}
.past > summary::-webkit-details-marker{display:none}
.past > summary::after{content:" ▾"}
.past[open] > summary::after{content:" ▴"}
.sub-t{margin:8px 0 1px; font-size:var(--fs-5); font-weight:600; color:var(--ink-2)}
.sub-t:first-child{margin-top:2px}
.sub-t span{color:var(--faint); font-weight:400; margin-left:2px}
.topics{display:flex; flex-wrap:wrap; gap:4px; margin-top:2px}
.tg{display:inline-block}
.tg > summary{list-style:none; cursor:pointer}
.tg > summary::-webkit-details-marker{display:none}
.tg > summary:focus-visible{outline:2px solid var(--now); outline-offset:2px; border-radius:999px}
.tg[open]{display:block; width:100%}
.tg[open] > summary .chip{background:var(--now); color:var(--now-ink)}
.tg .rows{margin-top:4px}

.tg > summary .chip{border:1px solid var(--rule); padding-right:4px}
.tg > summary .chip::after{content:"▾"; font-size:var(--fs-5); opacity:.65; margin-left:1px}
.tg[open] > summary .chip::after{content:"▴"; opacity:.9}
.tg > summary:hover .chip{border-color:var(--open); color:var(--open)}
.tg[open] > summary:hover .chip{color:var(--now-ink)}


.gauges{display:flex; margin-top:8px}
.gauges div{flex:1}
.gauges div + div{border-left:1px solid var(--rule); padding-left:12px; margin-left:12px}
.gauges dt{font-size:var(--fs-5); letter-spacing:.06em; color:var(--faint); margin:0}
.gauges dd{margin:1px 0 0; font-size:var(--fs-1); font-weight:600; letter-spacing:-.02em; line-height:1.15}
.gauges .a dd{color:var(--alert)} .gauges .o dd{color:var(--open)}
.gauges .mine{margin:3px 0 0; font-size:var(--fs-5); color:var(--open); font-weight:400; line-height:1.3}
#loop{margin:8px 0 0; font-size:var(--fs-5); color:var(--alert); font-weight:400}
#fresh{margin:12px 0 0; font-size:var(--fs-5); color:var(--faint); font-weight:400}
#fresh.stale{color:var(--alert)}


.log{list-style:none; margin:8px 0 0; padding:0 0 0 16px; position:relative}
.log::before{content:""; position:absolute; left:3px; top:9px; bottom:9px; width:1px; background:var(--rule)}
.log li{position:relative; padding:8px 0}
.log li::before{content:""; position:absolute; left:-15px; top:12px; width:7px; height:7px;
  border-radius:50%; background:var(--rule); border:2px solid var(--ground)}
.log li.big::before{width:9px; height:9px; left:-16px; background:var(--now)}
.log li.hot::before{background:var(--alert)}
.log li.day{padding:12px 0 2px}
.log li.day::before{display:none}
.log li.day .dt{font-size:var(--fs-5); letter-spacing:.1em; color:var(--faint)}
.log li.quiet::before{background:var(--rule-2); width:5px; height:5px; left:-14px; top:13px}
.log li.quiet .tx{color:var(--muted); font-weight:400; font-size:var(--fs-5)}
.log li.quiet .tx b{color:var(--ink-2); font-weight:600}
.log .dt{font-size:var(--fs-5); color:var(--faint)}
.log .tx{font-size:var(--fs-4); line-height:1.55; color:var(--ink-2)}
.log li.big .tx{font-weight:600; color:var(--ink)}
.log .k{font-size:var(--fs-5); color:var(--muted); margin-right:4px}
.log li.hot .k{color:var(--alert)}


.can{cursor:pointer}
.can::after{content:"?"; display:inline-block; margin-left:4px; width:13px; height:13px;
  line-height:12px; text-align:center; font-size:var(--fs-5); border-radius:50%;
  border:1px solid var(--rule); color:var(--faint); background:var(--rule-2)}
.can:hover::after,.can.on::after{border-color:var(--open); color:var(--open)}
.can.on::after{content:"×"}
.exp{margin:8px 0 2px; padding:12px 12px; border-left:2px solid var(--open-rule);
  background:var(--open-bg); font-size:var(--fs-5); line-height:1.55; color:var(--ink-2)}
.exp h3{font-size:var(--fs-4); font-weight:600; color:var(--ink); margin:0 0 4px}
.exp p{margin:0 0 8px} .exp p:last-child{margin-bottom:0}
.exp strong{font-weight:600; color:var(--ink)}
.none{font-size:var(--fs-5); color:var(--faint); font-weight:400; margin:8px 0 0}
footer{margin-top:32px; padding-top:16px; border-top:1px solid var(--rule);
  font-size:var(--fs-5); color:var(--faint); font-weight:400; line-height:1.55}



@media (max-width:560px){
  .three, .slots{flex-direction:column; gap:12px}
  .map .mnm{width:4.2rem}
  .legend{justify-content:flex-start}
  .dots-n span{font-size:var(--fs-5)}
  .st .nm{white-space:nowrap}       
}

@media (max-width:430px){
  .two, .flow{flex-direction:column; gap:12px}
  .flow > div + div{margin-left:0; margin-top:8px}
  .flow > div{border-radius:6px}
  .flow > div + div::before{left:50%; top:-7px; width:1px; height:7px}
  .fline{flex-direction:column; gap:3px}
  .fline .lb{width:auto; padding-top:0}
}

@media (max-width:380px){
  .wrap{padding-inline:12px}
  .gauges{flex-wrap:wrap; gap:8px}
  .gauges div{flex:1 1 100%; display:flex; align-items:baseline; justify-content:space-between}
  .gauges div + div{border-left:0; padding-left:0; margin-left:0; border-top:1px solid var(--rule-2); padding-top:8px}
  .gauges dd{font-size:var(--fs-2)}
  .rows .rt{max-width:38%}
}
.faint-name{color:var(--faint); font-weight:400; font-size:var(--fs-2)}



.oneline{display:flex; align-items:center; gap:12px; padding:16px 16px; border-radius:6px;
  background:var(--rule-2); margin:16px 0 16px}   
.oneline .ic{flex:none; width:21px; height:21px; border-radius:50%; background:var(--done)}
.oneline.todo{background:var(--alert-bg)}
.oneline.todo .ic{background:var(--alert)}

.oneline .tx2{flex:1; min-width:0; font-size:var(--fs-1); font-weight:600; color:var(--ink);
  line-height:1.3; letter-spacing:-.01em}
.oneline .tx2 .sub2{display:block; font-size:var(--fs-4); font-weight:400; color:var(--ink-2); margin-top:4px}

.legend{display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end; margin:8px 0 0;
  font-size:var(--fs-5); color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:4px}
.legend b{display:inline-block; width:11px; text-align:center; font-weight:600; color:var(--done)}
.legend b.hot{color:var(--alert)} .legend b.dim{color:var(--faint)}

.first{margin:16px 0 0; padding:16px 0 0; border-top:2px solid var(--now)}
.first .app{font-size:var(--fs-1); font-weight:600; letter-spacing:-.02em; margin:0; line-height:1.3}

.first .app.none{font-size:var(--fs-4); font-weight:400; color:var(--faint); letter-spacing:0}
.first .when{font-size:var(--fs-5); color:var(--faint); font-weight:400; margin:3px 0 0}
.first .when.stale{color:var(--alert)}
.fline{display:flex; gap:12px; align-items:baseline; padding:12px 0 0; margin-top:12px;
  border-top:1px solid var(--rule-2)}
.fline .lb{flex:none; width:5.6rem; font-size:var(--fs-5); letter-spacing:.06em; color:var(--faint);
  font-weight:600; padding-top:2px}
.fline .bd{flex:1; min-width:0; font-size:var(--fs-2); line-height:1.55; color:var(--ink)}
.fline .bd b{font-weight:600}
.fline .bd .q{display:block; font-size:var(--fs-4); color:var(--ink-2); font-weight:400; margin-top:4px;
  padding-left:12px; position:relative}
.fline .bd .q::before{content:"·"; position:absolute; left:2px; color:var(--faint)}
.fline .bd .sm{display:block; font-size:var(--fs-5); color:var(--muted); font-weight:400; margin-top:3px}
.fline.todo .bd b{color:var(--alert)}
.fline.todo .lb{color:var(--alert)}

.dots{display:flex; gap:4px; margin:8px 0 4px}
.dots i{flex:1; height:6px; border-radius:2px; background:var(--rule)}
.dots i.p{background:var(--done)}
.dots i.c{background:var(--now)}

.dots-n{display:flex; gap:4px; font-size:var(--fs-5); color:var(--ink-2); letter-spacing:.01em}
.dots-n span{flex:1; text-align:center}
.dots-n span.c{color:var(--now); font-weight:600}


.map{margin-top:12px; padding-top:12px; border-top:1px solid var(--rule-2)}
.map .mrow{display:flex; gap:8px; align-items:center; padding:3px 0}
.map .mnm{flex:none; width:5.6rem; font-size:var(--fs-5); color:var(--ink-2); text-align:right;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.map .mnm.done{color:var(--faint); font-weight:400}


.lay{margin:0 0 16px}
.lay .lt{margin:0 0 8px; font-size:var(--fs-5); color:var(--muted); font-weight:400}
.lay .lt b{color:var(--ink-2); font-weight:600}
.lay.hot .lt b{color:var(--alert)}
.lrow{display:flex; align-items:baseline; gap:8px; padding:4px 0 4px 12px;
  border-left:2px solid var(--rule); font-size:var(--fs-4)}
.lay.todo .lrow{border-left-color:var(--alert-rule)}
.lay.hot .lrow{border-left-color:var(--alert)}
.lay.dim .lrow{border-left-color:var(--rule-2)}
.lrow .l1{color:var(--muted); flex:none}
.lrow .lar{color:var(--faint); flex:none}
.lrow .l2{color:var(--ink); font-weight:600; min-width:0}
.lrow .lnum{margin-left:auto; flex:none; font-family:"Geist Mono",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  font-size:var(--fs-5); color:var(--ink-2)}
.lay.todo .lrow .lnum{color:var(--alert)}
.lay .lfoot{margin:8px 0 0 12px; font-size:var(--fs-5); color:var(--faint)}

.two2{margin-top:16px; border-top:1px solid var(--rule-2); padding-top:12px}
.two2 .lt{margin:0 0 12px; font-size:var(--fs-5); color:var(--muted)}
.two2 .lt b{color:var(--ink-2); font-weight:600}
.two2 .unit{display:block; margin-top:4px; font-size:var(--fs-5); color:var(--faint);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.two2 .unit i{display:inline-block; width:8px; height:8px; border-radius:2px;
  margin:0 2px 0 8px; vertical-align:-1px}
.two2 .unit i.k1{background:var(--live)}
.two2 .unit i.k4{background:var(--alert)}
.two2 .unit i.k2{background:transparent; border:1px dashed var(--rail)}
.two2 .unit i.k3{background:transparent; box-shadow:inset 0 0 0 1px var(--rail)}


.two2{margin-top:16px; border-top:1px solid var(--rule-2); padding-top:12px}
.two2 .lt{margin:0 0 12px; font-size:var(--fs-5); color:var(--muted)}
.two2 .lt b{color:var(--ink-2); font-weight:600}
.two2 .unit{display:block; margin-top:4px; font-size:var(--fs-5); color:var(--faint); line-height:1.55}
.two2 .unit i{display:inline-block; width:8px; height:8px; border-radius:2px;
  margin:0 2px 0 8px; vertical-align:-1px}
.two2 .unit i.k1{background:var(--live)}
.two2 .unit i.k2{background:transparent; border:1px dashed var(--rail)}
.two2 .unit i.k3{background:transparent; box-shadow:inset 0 0 0 1px var(--rail)}
.maprow{margin-top:12px}
.maprow + .maprow{border-top:1px solid var(--rule-2); padding-top:12px}
.mhead{display:flex; align-items:baseline; gap:8px; margin-bottom:4px}
.mhead .fn{font-size:var(--fs-3); color:var(--ink); font-weight:600}
.mhead .fv{margin-left:auto; font-family:"Geist Mono",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  font-size:var(--fs-5); color:var(--muted)}
.mapr{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:flex-start}

.sgrp{min-width:0}
.sgrp > summary{list-style:none; cursor:pointer; display:block}
.sgrp > summary::-webkit-details-marker{display:none}
.cells{display:flex; flex-wrap:wrap; gap:2px; max-width:100%}
.cells i{display:block; width:11px; height:13px; border-radius:2px}
.cells i.ok{background:var(--live)}
.cells i.gs{background:transparent; border:1px dashed var(--rail)}
.cells i.un{background:transparent; box-shadow:inset 0 0 0 1px var(--rail)}
.gn{display:block; margin-top:3px; font-size:var(--fs-5); color:var(--muted);
  border-bottom:1px dotted var(--rail); display:inline-block}
.sgrp[open] > summary .gn{color:var(--ink); border-bottom-color:var(--open)}
.sgrp > summary:hover .gn{color:var(--ink-2)}

.what{margin:8px 0 2px; padding:0 0 0 12px; list-style:none;
  border-left:2px solid var(--rule); max-width:22rem}
.what li{margin:0 0 8px; font-size:var(--fs-5); line-height:1.55}
.what li b{display:block; color:var(--ink); font-weight:600}
.how{display:block; color:var(--muted); font-size:var(--fs-5); margin-top:1px}
.how.dim2{color:var(--faint); font-style:normal}
.maprow.done .mhead .fn{color:var(--muted); font-weight:600}
.maprow.done .mhead .fv{color:var(--faint)}
.maprow.hot .cells i.ok{background:var(--alert)}
.map .mfoot{margin:8px 0 0; font-size:var(--fs-5); color:var(--faint); font-weight:400; line-height:1.55}


.two{display:flex; gap:16px; margin-top:4px}
.two > div{flex:1; min-width:0}
.two .tt{font-size:var(--fs-5); color:var(--faint); letter-spacing:.04em; margin:0 0 4px}
.two .bar{display:flex; gap:2px; flex-wrap:wrap; margin-bottom:8px}
.two .bar i{flex:0 0 13px; height:15px; border-radius:2px; background:var(--live)}

.two .hot .tt{color:var(--alert)}
.two .hot .bar i{background:var(--alert)}
.two li{list-style:none; font-size:var(--fs-5); color:var(--ink-2); line-height:1.55; margin:0 0 4px}
.two li b{display:block; color:var(--ink); font-weight:600}
.two li .src{color:var(--muted); font-size:var(--fs-5); font-weight:400}
.three{display:flex; gap:8px; margin-top:4px}
.three > div{flex:1; padding:8px 12px; border-radius:6px; background:var(--rule-2); min-width:0}
.three .n{font-size:var(--fs-1); font-weight:600; line-height:1.1; font-family:"Geist Mono",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace}
.three .k{font-size:var(--fs-5); color:var(--faint); margin-top:2px}
.three .wl{font-size:var(--fs-5); color:var(--ink-2); margin-top:4px; line-height:1.3}
.three .later .n{color:var(--open)}
.picks{margin-top:12px}
.picks .pt{font-size:var(--fs-5); color:var(--faint); margin:0 0 4px}
.picks .row{display:flex; gap:4px; flex-wrap:wrap; align-items:center; margin-bottom:4px}
.picks .opt{font-size:var(--fs-5); padding:3px 8px; border-radius:999px; border:1px solid var(--rule);
  color:var(--muted)}
.picks .opt.on{border-color:var(--now); background:var(--now); color:var(--now-ink); font-weight:600}
.picks .src{display:block; font-size:var(--fs-5); color:var(--muted); font-weight:400; margin-left:2px}



.crow{display:flex; align-items:baseline; gap:8px; min-height:32px; padding:3px 0;
  font-size:var(--fs-4); color:var(--ink)}
.crow .ci{flex:none; width:14px; text-align:center; font-weight:600; color:var(--done)}
.crow.hot .ci{color:var(--alert)}
.crow.dim .ci{color:var(--faint)}
.crow.hot .cn{color:var(--ink); font-weight:600}
.crow.dim .cn{color:var(--ink-2)}
.crow .cn{flex:none}
.crow .cm{font-size:var(--fs-5); color:var(--muted); font-weight:400; min-width:0}
.crow .cs{margin-left:auto; flex:none; font-size:var(--fs-5); color:var(--faint);
  font-family:"Geist Mono",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace}

.st9{width:100%; border-collapse:collapse; margin-top:4px; font-size:var(--fs-4)}
.st9 th{text-align:left; font-size:var(--fs-5); letter-spacing:.08em; color:var(--faint);
  font-weight:600; padding:0 0 4px; border-bottom:1px solid var(--rule)}
.st9 th.r{text-align:right}
.st9 td{padding:8px 0; border-bottom:1px solid var(--rule-2); vertical-align:top; color:var(--ink)}
.st9 tr:last-child td{border-bottom:0}
.st9 td.w{width:1.6rem; font-weight:600}
.st9 td.n{color:var(--ink-2)}
.st9 td.n .memo{display:block; font-size:var(--fs-5); color:var(--muted); font-weight:400; margin-top:2px}
.st9 td.s{text-align:right; white-space:nowrap; font-size:var(--fs-5); color:var(--muted)}
.st9 tr.hot td.w, .st9 tr.hot td.s{color:var(--alert)}
.st9 tr.hot td.n{color:var(--ink)}
.st9 tr.dim td.w, .st9 tr.dim td.n, .st9 tr.dim td.s{color:var(--muted)}
.st9 tr.ok td.w{color:var(--done)}
.sumbar{display:flex; gap:3px; margin:8px 0 0}
.sumbar i{height:5px; border-radius:2px; background:var(--rule)}
.sumbar i.ok{background:var(--live)} .sumbar i.hot{background:var(--alert)}

.slots{display:flex; gap:8px; margin-top:4px}
.slots > div{flex:1; min-width:0; padding:12px; border-radius:6px; background:var(--rule-2);
  border:1px dashed transparent}
.slots > div.empty{background:transparent; border-color:var(--rail)}
.slots .sk{font-size:var(--fs-5); letter-spacing:.06em; color:var(--faint)}
.slots .sv{font-size:var(--fs-4); color:var(--ink); margin-top:4px; line-height:1.3; font-weight:600}
.slots > div.empty .sv{color:var(--muted); font-weight:400}

.steps9{margin-top:4px}
.steps9 .sr{display:flex; gap:8px; align-items:baseline; padding:8px 0;
  border-bottom:1px solid var(--rule-2)}
.steps9 .sr:last-child{border-bottom:0}
.steps9 .si{flex:none; width:1.4rem; font-size:var(--fs-5); color:var(--faint);
  font-family:"Geist Mono",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace}
.steps9 .sx{flex:1; min-width:0; font-size:var(--fs-4); color:var(--ink)}
.steps9 .sx .memo{display:block; font-size:var(--fs-5); color:var(--muted); font-weight:400}
.steps9 .sg{flex:none; font-size:var(--fs-5); color:var(--muted); white-space:nowrap}
.steps9 .sr.ok .si{color:var(--done)} .steps9 .sr.ok .sx{color:var(--ink-2)}
.steps9 .sr.hot .si, .steps9 .sr.hot .sg{color:var(--alert)}
.steps9 .sr.todo .sx{font-weight:600}

.flow{display:flex; align-items:stretch; gap:0; margin-top:4px}
.flow > div{flex:1; min-width:0; padding:12px 12px; background:var(--rule-2); position:relative}
.flow > div:first-child{border-radius:6px 0 0 6px}
.flow > div:last-child{border-radius:0 6px 6px 0}
.flow > div + div{margin-left:8px}
.flow > div + div::before{content:""; position:absolute; left:-7px; top:50%; width:7px; height:1px;
  background:var(--rail)}
.flow .fn2{font-size:var(--fs-1); font-weight:600; font-family:"Geist Mono",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace; line-height:1.1}
.flow .fk{font-size:var(--fs-5); color:var(--faint); margin-top:2px}
.flow .fx{font-size:var(--fs-5); color:var(--ink-2); margin-top:4px; line-height:1.3}
.flow > div.zero .fn2{color:var(--faint)}
.sumbar i.un{background:var(--rail)}


.stg{border-top:1px solid var(--rule-2); padding:0}
.stg:first-child{border-top:0}
.stg > summary{display:flex; align-items:baseline; gap:12px; padding:8px 0; cursor:pointer;
  list-style:none}
.stg > summary::-webkit-details-marker{display:none}
.stg > summary::after{content:""; margin-left:auto; flex:none; width:7px; height:7px;
  border-right:2px solid var(--faint); border-bottom:2px solid var(--faint);
  transform:rotate(45deg) translate(-2px,-2px)}
.stg[open] > summary::after{transform:rotate(-135deg) translate(-2px,0)}
.stg > summary:hover::after{border-color:var(--open)}

.ninewrap{margin:16px 0 4px}
.nine{display:flex; gap:4px; align-items:center}
.nine i{flex:1; height:10px; border-radius:2px; background:var(--rule); position:relative}

.nine i{background:transparent; box-shadow:inset 0 0 0 1px var(--rail)}  
.nine i.p{background:var(--live); box-shadow:none}     
.nine i.s{background:var(--rail); box-shadow:none}     
.nine i.c{flex:2.2; height:14px; background:var(--now)} 
.nine i.c::after{content:attr(data-n); position:absolute; left:0; top:18px;
  font-size:var(--fs-5); color:var(--ink); font-weight:600; white-space:nowrap}
.ninefoot{margin:24px 0 0; font-size:var(--fs-4); color:var(--muted)}
.ninefoot b{color:var(--ink-2); font-weight:600}
.ninefoot .sm2{display:block; margin-top:3px; font-size:var(--fs-5); color:var(--faint); font-weight:400}


.lead{margin:0 0 12px; font-size:var(--fs-3); color:var(--ink-2); line-height:1.55}
.lead b{color:var(--ink); font-weight:600}
.two2 .unit{display:block; margin-top:3px; font-size:var(--fs-5); color:var(--faint)}
.two2 .unit b{color:var(--muted); font-weight:600}


.stg .sgn{flex:none; font-size:var(--fs-4); color:var(--faint); width:1.3rem;
  font-family:"Geist Mono",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace; font-variant-numeric:tabular-nums}
.stg .sgt{flex:none; font-size:var(--fs-3); color:var(--ink-2); width:3.4rem}
.stg .sgs{font-size:var(--fs-4); color:var(--muted); font-weight:400; min-width:0}
.stg.now{background:var(--rule-2); border-radius:6px; padding:2px 12px; margin:2px -12px;
  border-top-color:transparent}
.stg.now .sgt{color:var(--ink); font-weight:600}
.stg.now .sgn{color:var(--now)}
.stg.now .sgs{color:var(--ink-2)}

.stg.past .sgt{color:var(--ink-2); font-weight:400}
.stg.past .sgn{color:var(--live); font-weight:600}
.stg.past .sgs{color:var(--muted)}

.stg .sgt{color:var(--muted)}
.stg .sgs{color:var(--faint)}

.stg.skip .sgn{color:var(--faint); font-weight:400}
.stg.skip .sgt{color:var(--muted)}
.stg.hot .sgs{color:var(--alert)}
.stg .sgbody{padding:2px 0 16px}

.rest{margin-top:24px; border-top:1px solid var(--rule); padding-top:12px}
.rest > summary{list-style:none; cursor:pointer; font-size:var(--fs-5); color:var(--muted);
  padding:8px 0; display:flex; align-items:center; gap:8px}
.rest > summary::-webkit-details-marker{display:none}
.rest > summary::after{content:"펼치기"; margin-left:auto; font-size:var(--fs-5); color:var(--faint);
  border:1px solid var(--rule); border-radius:999px; padding:2px 8px}
.rest[open] > summary::after{content:"접기"}
.rest > summary:hover{color:var(--ink)}
.rest > summary b{font-weight:600; color:var(--ink-2)}


.path{list-style:none; margin:8px 0 0; padding:0 0 0 16px; position:relative}
.path::before{content:""; position:absolute; left:4px; top:11px; bottom:11px;
  width:1px; background:var(--rail)}
.path li{position:relative; padding:4px 0}
.path li::before{content:""; position:absolute; left:-17px; top:10px; width:9px; height:9px;
  border-radius:50%; background:var(--rail); border:2px solid var(--panel)}
.path li.on::before{background:var(--now)}
.path li.off::before{background:var(--panel); border-color:var(--rail)}
.path li.hot::before{background:var(--alert)}
.path .sn{font-size:var(--fs-4); line-height:1.55; color:var(--ink); font-weight:600}
.path .wh{display:block; font-size:var(--fs-5); color:var(--muted); font-weight:400; margin-top:1px}
.path li.off .sn{color:var(--muted); font-weight:400}
.path .num{font-family:var(--mono,ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace);
  font-size:var(--fs-5); color:var(--ink-2)}

.keyline{margin:8px 0 0; padding:8px 12px; background:var(--open-bg);
  border-left:2px solid var(--open-rule); font-size:var(--fs-5); color:var(--ink-2)}
.keyline code{font-family:var(--mono,ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace);
  font-size:var(--fs-5); color:var(--ink)}

#first{display:grid; gap:24px; margin-top:12px; border-top:0; padding-top:0}

#first > *{min-width:0}
#first h2.n-h{margin:0 0 8px; font-size:var(--fs-5); font-weight:600; color:var(--muted); letter-spacing:.07em; text-transform:uppercase}
.n-meta{display:flex; justify-content:space-between; font-size:var(--fs-5); color:var(--faint)}

.n-hero{border:1px solid var(--open-rule); border-radius:12px; background:var(--panel); padding:16px 16px 12px; margin:0 0 4px}
.n-top{display:flex; gap:16px; align-items:center}
.n-pj{all:unset; cursor:pointer; margin-left:12px; vertical-align:3px; font-size:var(--fs-5); font-weight:400; color:var(--ink-2); border:1px solid var(--live-rule); border-radius:999px; padding:2px 12px; white-space:nowrap}
.n-pj:hover, .n-pj[aria-expanded="true"]{border-color:var(--muted); color:var(--ink)} .n-pj:focus-visible{outline:2px solid var(--open); outline-offset:2px}
.n-pjm{margin:12px 0 0 64px; max-width:380px; border:1px solid var(--live-rule); border-radius:12px; background:var(--ground); padding:8px}
.n-pjm .it{display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:6px; font-size:var(--fs-4); color:var(--ink); text-decoration:none}
.n-pjm a.it:hover{background:var(--rule)} .n-pjm .it.on{background:var(--rule-2)} .n-pjm .it.off{color:var(--faint)}
.n-pjm .ck{color:var(--done-b); width:24px; text-align:center} .n-pjm .pi{flex:none; width:24px; height:24px; border-radius:6px; background:var(--rule); color:var(--ink-2); font-size:var(--fs-5); display:flex; align-items:center; justify-content:center}
.n-pjm .nm{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.n-plan .it .now{font-size:var(--fs-5); color:var(--ink-2)} .n-plan .it .m{margin-left:auto}
.n-plan .tg{flex:none; font-size:var(--fs-5); padding:1px 8px; line-height:1.3; border-radius:999px; border:1px solid var(--faint); color:var(--muted)} .n-plan .tg.in{border-color:var(--done-b); color:var(--ink)}
.n-plan .ph{margin:4px 12px 8px; font-size:var(--fs-5); color:var(--ink-2)}
.n-plan .pf{margin:8px 12px 4px; font-size:var(--fs-5); color:var(--muted); line-height:1.55} .n-pjm .m{margin-left:auto; font-size:var(--fs-5); color:var(--muted); white-space:nowrap}
@media (max-width:520px){ .n-pjm{margin-left:0; max-width:none} .n-pj{display:inline-block; margin:8px 0 0; vertical-align:0} }
.n-bar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:16px; padding-top:12px; border-top:1px solid var(--rule)}
.n-st{display:flex; align-items:center; gap:12px; font-size:var(--fs-4); color:var(--alert)}
.n-mini{display:flex; gap:3px; align-items:flex-end; height:14px} .n-mini i{width:9px; height:4px; border-radius:2px; background:var(--rule)} .n-mini i.d{height:14px; background:var(--done-b)} .n-mini i.c{height:14px; background:var(--alert)}
.n-bar .c{font-size:var(--fs-5); padding:2px 12px; border-radius:999px; border:1px solid var(--live-rule); color:var(--ink-2); white-space:nowrap} .n-bar .c.stale{border-color:var(--alert-rule); color:var(--alert)}
.n-bar .c i{display:inline-block; width:6px; height:6px; border-radius:50%; background:#7FBF8F; margin-right:8px; vertical-align:1px} .n-bar .c.stale i{background:var(--alert)}
.n-ic{flex:none; width:48px; height:48px; border-radius:12px; background:var(--rule); color:#F8F5EA; font-size:var(--fs-3); font-weight:600; display:flex; align-items:center; justify-content:center; letter-spacing:-.02em}
.n-ht{flex:1; min-width:0} .n-ht h1{margin:0; font-size:var(--fs-1); line-height:1.3; font-weight:600; color:var(--ink)} .n-ht h1 b{font-weight:600; color:var(--ink)}
.n-ht p{margin:3px 0 0; font-size:var(--fs-4); color:var(--ink-2); line-height:1.3}
.n-hc{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
.n-hc .c{font-size:var(--fs-5); padding:2px 12px; border-radius:999px; border:1px solid var(--live-rule); color:var(--ink-2); white-space:nowrap}
.n-hc .c.o{border-color:var(--alert-rule); color:var(--alert)} .n-hc .c.stale{border-color:var(--alert-rule); color:var(--alert)}
.n-hc .c i{display:inline-block; width:6px; height:6px; border-radius:50%; background:#7FBF8F; margin-right:8px; vertical-align:1px} .n-hc .c.stale i{background:var(--alert)}
.n-meta b{color:var(--muted); font-weight:600}
.n-meta .stale{color:var(--alert)}
.n-kv{margin:0; display:grid; gap:1px}
.n-kv div{min-width:0}
.n-kv dt{font-size:var(--fs-5); color:var(--faint); letter-spacing:.03em}
.n-kv dd{margin:0; color:var(--ink); font-size:var(--fs-4); overflow-wrap:anywhere}
.n-kv.top{grid-template-columns:repeat(var(--n,4),1fr); background:var(--rule); border:1px solid var(--rule); border-radius:12px; overflow:hidden}
.n-kv.top div{background:var(--panel); padding:12px 12px}
.n-kv.top dd{font-size:var(--fs-2); font-weight:600; letter-spacing:-.02em}
.n-kv.row{grid-template-columns:repeat(auto-fit,minmax(70px,1fr)); gap:4px 12px; margin-top:8px}
.n-kv.one{margin-top:8px}
.n-kv.mini{grid-template-columns:auto 1fr; gap:0 12px; margin-top:3px}
.n-kv.mini div{display:contents}
.n-kv.mini dt{line-height:1.55} .n-kv.mini dd{font-size:var(--fs-5); color:var(--ink-2); line-height:1.55}
.n-chip{display:inline-block; font-size:var(--fs-5); line-height:17px; padding:0 8px; border-radius:6px; border:1px solid var(--rule); color:var(--muted); white-space:nowrap}
.n-chip.g{color:var(--live); border-color:var(--live-rule)}
.n-chip.a{color:var(--alert); border-color:var(--alert-rule)}
.n-chip.w{color:var(--ink); border-color:var(--faint)}


.n-nine{display:grid; grid-template-columns:repeat(9,1fr); gap:8px; margin-top:16px; align-items:end}
.n-nine button{all:unset; position:relative; display:block; height:90px; border:1px solid var(--open-rule); border-radius:6px; box-sizing:border-box; cursor:pointer}
.n-nine button i{position:absolute; left:3px; right:3px; bottom:3px; border-radius:2px; background:var(--faint)}
.n-nine button.c i{background:var(--alert)}
.n-nine button.d i{background:var(--done-b)} .n-nine button.d b{color:var(--ink)} .n-nine button.d b.in{color:var(--ground)}   
.n-nine button b{position:absolute; left:0; right:0; text-align:center; font-size:var(--fs-5); font-weight:400; font-variant-numeric:tabular-nums; color:var(--muted)}
.n-nine button.c b{color:var(--alert); font-weight:600}
.n-nine button b.in{color:var(--ground); font-weight:600}
.n-nine button:hover{border-color:var(--faint)}
.n-nine button.sel{border-color:var(--muted)}
.n-nine button:focus-visible{outline:2px solid var(--open); outline-offset:3px}
@media (max-width:480px){ .n-nine, .n-ninelab{gap:4px} .n-nine button b{font-size:var(--fs-5); letter-spacing:-.3px} .n-ninelab{font-size:var(--fs-5); letter-spacing:-.4px} }   
.n-ninelab{display:grid; grid-template-columns:repeat(9,1fr); gap:8px; margin-top:8px; font-size:var(--fs-4); color:var(--muted); text-align:center; white-space:nowrap}   
.n-ninelab .c{color:var(--alert)}
.n-ninelab .sel{color:var(--ink); font-weight:600; text-decoration:underline; text-underline-offset:3px}
.n-pick{margin:8px 0 0; font-size:var(--fs-5); color:var(--faint)}
.n-stg.one{border-top:0}
.n-stg.one.cur{margin-top:2px}
.n-stg{border-top:1px solid var(--rule)}
.n-h+.n-stg{border-top:0}
.n-stg summary,.n-stg .sum{display:grid; grid-template-columns:18px 1fr auto; gap:8px; align-items:center; padding:8px 0; list-style:none}
.n-stg summary,.n-feat summary{cursor:pointer}
.n-stg summary::-webkit-details-marker,.n-feat summary::-webkit-details-marker{display:none}
#first summary:focus-visible{outline:1px solid var(--muted); outline-offset:2px; border-radius:6px}
.n-stg i{font-style:normal; font-size:var(--fs-5); text-align:center}
.n-cs{display:inline-flex; flex-wrap:wrap; justify-content:flex-end; gap:4px}
.n-stg .sn{font-weight:600; font-size:var(--fs-3)}
.n-stg .sn em{font-style:normal; font-size:var(--fs-5); color:var(--faint); font-weight:400; margin-left:8px}
.n-stg.done>summary i,.n-stg.done .sum i{color:var(--live)}
.n-stg.done[open]{padding-bottom:12px}
.n-stg.done>.n-kv{margin:0 0 8px 24px}
.n-stg.skip .sn,.n-stg.skip i,.n-stg.later .sn,.n-stg.later i{color:var(--faint)}
.n-stg.cur{background:var(--panel); border:1px solid var(--rule); border-radius:12px; padding:2px 12px 12px; margin:8px 0}
.n-zone .n-stg.cur{background:transparent; border-color:transparent; padding:0; margin:0}   
.n-stg.cur+.n-stg{border-top:0}
.n-stg.cur>.n-kv.row{margin:0 0 0 24px}
